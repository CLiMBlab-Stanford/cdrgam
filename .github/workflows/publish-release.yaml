name: Publish GitHub release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch release references
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Validate the release tag
        run: Rscript .github/workflows/check-release-tag.R "$GITHUB_REF_NAME"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "cdrgam ${GITHUB_REF_NAME#v}" \
              --notes-from-tag \
              --latest
          fi
